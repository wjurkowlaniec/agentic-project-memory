[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory"
version = "0.1.0"
description = "Local, project-scoped memory for agentic workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.scripts]
pmem = "project_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
